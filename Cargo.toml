[package]
name = "tycho-wallet-api"
version = "1.0.0"
edition = "2021"
authors = ["Broxus team"]
publish = false
license-file = "LICENSE"

[dependencies]
anyhow = "1.0"
axum = { version = "0.7", features = ["multipart", "macros"] }
argh = "0.1"
argon2 = "0.4.1"
async-trait = "0.1"
base64 = "0.13"
bigdecimal = { version = "0.4.5", features = ["serde"] }
chacha20poly1305 = "0.10.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5.3", features = ["derive"] }
config = { version = "0.13.2", default-features = false, features = ["yaml"] }
dashmap = "5.3.4"
derive_more = { version = "1.0.0", features = ["full"] }
env_logger = "0.10.0"
everscale-network = "^0.5.4"
everscale-types = { version = "0.1.2", features = ["tycho", "abi"] }
futures = "0.3"
futures-util = "0.3.31"
hex = "0.4"
hmac-sha256 = "1.1.4"
http = "0.2"
itertools = "0.10.1"
lazy_static = "1.4.0"
log = { version = "0.4", features = ["std", "serde"] }
log4rs = "1.0"
lru = "0.8"
metrics = "0.20.1"
metrics-exporter-prometheus = { version = "0.16.0", default-features = false, features = ["http-listener"] }
num-bigint = "0.4"
num-traits = "0.2"
opg = { version = "0.2", features = ["uuid"] }
parking_lot = "0.12.0"
pomfrit = "0.1"
rand = "0.8"
rayon = "1.10"
regex = "1.5"
reqwest = { version = "0.12", features = ["json"] }
rustc-hash = "1.1.0"
sentry = { version = "0.27.0", features = ["log", "debug-logs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9.4"
sqlx = { version = "0.8.2", features = ["runtime-tokio-native-tls", "postgres", "uuid", "bigdecimal", "chrono", "json"] }
strum = "0.24.1"
strum_macros = "0.24.1"
thiserror = "1.0"
tokio = { version = "1", features = ["sync", "fs", "rt-multi-thread", "macros", "signal", "parking_lot"] }
tokio-util = "0.7"
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["trace", "cors", "limit", "set-header", "metrics"] }
tower-service = "0.3.3"
tracing = "0.1.34"

uuid = { version = "1.1", features = ["v4", "serde"] }

ed25519-dalek = { git = "https://github.com/broxus/ed25519-dalek.git" }

tikv-jemallocator = { version = "0.6.0", features = [
    "unprefixed_malloc_on_supported_platforms",
    "background_threads",
] }

tycho-block-util = { git = "https://github.com/broxus/tycho.git", rev = "35a9a15b517c8e1fb291fd5c4a1cb14a5899c834" }
tycho-core = { git = "https://github.com/broxus/tycho.git", rev = "35a9a15b517c8e1fb291fd5c4a1cb14a5899c834" }
tycho-light-node = { git = "https://github.com/broxus/tycho.git", rev = "35a9a15b517c8e1fb291fd5c4a1cb14a5899c834" }
tycho-storage = { git = "https://github.com/broxus/tycho.git", rev = "35a9a15b517c8e1fb291fd5c4a1cb14a5899c834" }
tycho-util = { git = "https://github.com/broxus/tycho.git", rev = "35a9a15b517c8e1fb291fd5c4a1cb14a5899c834" }

tycho-vm = { git = "https://github.com/broxus/tycho-vm.git", rev = "e3c1473a8749cde50cbf5c57166169de09e41000" }

# TON specific dependencies
ton_block = { git = "https://github.com/broxus/ton-labs-block" }
ton_abi = { git = "https://github.com/broxus/ton-labs-abi" }
ton_types = { git = "https://github.com/broxus/ton-labs-types" }

# Nekoton SDK
nekoton = { git = "https://github.com/broxus/nekoton.git", default-features = true, rev="561b60e7a47e994500dce9f25933dd8d8fb2987a" }
nekoton-abi = { git = "https://github.com/broxus/nekoton.git", features = ["derive"], rev="561b60e7a47e994500dce9f25933dd8d8fb2987a" }
nekoton-utils = { git = "https://github.com/broxus/nekoton.git", rev="561b60e7a47e994500dce9f25933dd8d8fb2987a" }
nekoton-contracts = { git = "https://github.com/broxus/nekoton.git", rev="561b60e7a47e994500dce9f25933dd8d8fb2987a" }

sysinfo = "0.30.13"

[patch.crates-io]
everscale-types = { git = "https://github.com/broxus/everscale-types.git", rev = "82c343b2bd17ceb51db0575b6b8ee821ccda037e" }

[features]
default = []
