[package]
name = "tycho-wallet-api"
version = "1.0.0"
edition = "2021"
authors = ["Broxus team"]
publish = false
license-file = "LICENSE"

[dependencies]
aide = { version = "0.13.5", features = ["axum", "axum-extra", "scalar", "macros"] }
anyhow = "1.0"
axum = { version = "0.7", features = ["multipart", "macros"] }
argon2 = "0.4.1"
async-trait = "0.1"
base64 = "0.13"
bigdecimal = { version = "0.4.5", features = ["serde"] }
chacha20poly1305 = "0.10.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5.3", features = ["derive"] }
dashmap = "5.3.4"
derive_more = { version = "1.0.0", features = ["full"] }
futures = "0.3"
futures-util = "0.3.31"
hex = "0.4"
hmac-sha256 = "1.1.4"
http = "0.2"
itertools = "0.10.1"
lazy_static = "1.4.0"
log = { version = "0.4", features = ["std", "serde"] }
lru = "0.8"
metrics = "0.20.1"
metrics-exporter-prometheus = { version = "0.16.0", default-features = false, features = ["http-listener"] }
num-bigint = "0.4"
num-traits = "0.2"
opg = { version = "0.2", features = ["uuid"] }
parking_lot = "0.12.0"
pbkdf2 = { version = "0.12.2" }
pomfrit = "0.1"
rand = "0.8"
rayon = "1.10"
regex = "1.5"
reqwest = { version = "0.12", features = ["json"] }
rustc-hash = "1.1.0"
schemars = { version = "0.8.13", features = ["chrono", "bigdecimal04", "uuid1"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9.4"
sha2 = { version = "0.10.8" }
slip10_ed25519 = "0.1.3"
sqlx = { version = "0.8.2", features = ["runtime-tokio-native-tls", "postgres", "uuid", "bigdecimal", "chrono", "json"] }
strum = "0.24.1"
strum_macros = "0.24.1"
thiserror = "1.0"
tiny-hderive = { git = "https://github.com/broxus/tiny-hderive.git" }
tiny-bip39 = { git = "https://github.com/broxus/tiny-bip39.git", default-features = false }
tokio = { version = "1", features = ["sync", "fs", "rt-multi-thread", "macros", "signal", "parking_lot"] }
tokio-util = "0.7"
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["trace", "cors", "limit", "set-header", "metrics"] }
tower-service = "0.3.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tycho-types = { git = "https://github.com/broxus/tycho-types.git", rev = "f9e5dbe1222ee51f3e4f5a6836f95a515dd6cdf1" , features = ["tycho", "stats", "serde", "abi"] }

uuid = { version = "1.1", features = ["v4", "serde"] }

ed25519-dalek = { version = "2.1.1" }

tikv-jemallocator = { version = "0.6.0", features = [
    "unprefixed_malloc_on_supported_platforms",
    "background_threads",
] }

tycho-block-util = { version = "0.3.6" }
tycho-core = { version = "0.3.6", features = ["cli"]  }
tycho-storage = { version = "0.3.6" }
tycho-util = { version = "0.3.6", features = ["cli"] }

tycho-vm = "0.3.2"
tycho-executor = "0.3.2"

nekoton-core = { git = "https://github.com/broxus/tycho-nekoton.git" }

sysinfo = "0.30.13"

[features]
default = []

[patch.crates-io]
tycho-types = { git = "https://github.com/broxus/tycho-types.git", rev = "f9e5dbe1222ee51f3e4f5a6836f95a515dd6cdf1" , features = ["tycho", "stats", "serde", "abi"] }
